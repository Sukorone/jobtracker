name: Keep Supabase awake

# Free Supabase projects pause after a week without requests.
on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ping database
        run: |
          set -a; . ./.env; set +a
          curl -fsS -X POST "$VITE_SUPABASE_URL/rest/v1/rpc/ping" \
            -H "apikey: $VITE_SUPABASE_KEY" -H "Content-Type: application/json" -d '{}'
